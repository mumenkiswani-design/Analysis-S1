name: Build direct dashboard data

on:
  push:
    branches: [main]
    paths:
      - 'updated-data.js'
      - '.github/workflows/build-direct-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Decode embedded dashboard data
        run: |
          node <<'NODE'
          const fs = require('fs');
          const zlib = require('zlib');
          const src = fs.readFileSync('updated-data.js','utf8');
          const m = src.match(/const b64='([^']+)'/);
          if (!m) throw new Error('Embedded base64 data not found in updated-data.js');
          const compressed = Buffer.from(m[1], 'base64');
          const methods = [
            ['brotli', b => zlib.brotliDecompressSync(b)],
            ['gzip', b => zlib.gunzipSync(b)],
            ['zlib', b => zlib.inflateSync(b)],
            ['raw-deflate', b => zlib.inflateRawSync(b)],
            ['unzip', b => zlib.unzipSync(b)]
          ];
          let decoded = null, used = null, lastErr = null;
          for (const [name, fn] of methods) {
            try {
              const text = fn(compressed).toString('utf8');
              JSON.parse(text);
              decoded = text; used = name; break;
            } catch (e) { lastErr = e; }
          }
          if (!decoded) throw lastErr || new Error('Unable to decode dashboard data');
          fs.writeFileSync('direct-data.js', 'window.S1_DATA=' + decoded + ';\n');
          console.log('Decoded with:', used);
          console.log('direct-data.js bytes:', fs.statSync('direct-data.js').size);
          NODE
      - name: Commit direct data file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add direct-data.js
          if git diff --cached --quiet; then
            echo 'No data change'
          else
            git commit -m 'Build direct dashboard data [skip ci]'
            git push
          fi

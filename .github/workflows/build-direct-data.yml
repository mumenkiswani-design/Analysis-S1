name: Build direct dashboard data

on:
  push:
    branches: [main]
    paths:
      - 'updated-data.js'
      - '.github/workflows/build-direct-data.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decompression libraries
        run: pip install brotli zstandard lz4 python-snappy
      - name: Decode embedded dashboard data
        run: |
          python <<'PY'
          import re, base64, json, zlib, gzip, bz2, lzma
          from pathlib import Path
          import brotli, zstandard as zstd, lz4.frame, snappy
          src=Path('updated-data.js').read_text(encoding='utf-8')
          m=re.search(r"const b64='([^']+)'",src)
          if not m: raise RuntimeError('Embedded base64 data not found')
          b=base64.b64decode(m.group(1))
          print('compressed bytes',len(b),'head',b[:16].hex())
          methods=[
            ('gzip',lambda x:gzip.decompress(x)),
            ('zlib',lambda x:zlib.decompress(x)),
            ('raw-deflate',lambda x:zlib.decompress(x,-15)),
            ('bz2',lambda x:bz2.decompress(x)),
            ('lzma-auto',lambda x:lzma.decompress(x)),
            ('brotli',lambda x:brotli.decompress(x)),
            ('zstd',lambda x:zstd.ZstdDecompressor().decompress(x)),
            ('lz4-frame',lambda x:lz4.frame.decompress(x)),
            ('snappy',lambda x:snappy.decompress(x)),
          ]
          decoded=None
          for name,fn in methods:
            try:
              out=fn(b)
              text=out.decode('utf-8')
              json.loads(text)
              decoded=text
              print('SUCCESS',name,'decoded bytes',len(out))
              break
            except Exception as e:
              print('FAIL',name,type(e).__name__,str(e)[:120])
          if decoded is None:
            raise RuntimeError('No supported decoder could decode updated-data.js')
          Path('direct-data.js').write_text('window.S1_DATA='+decoded+';\n',encoding='utf-8')
          PY
      - name: Commit direct data file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add direct-data.js
          if git diff --cached --quiet; then
            echo 'No data change'
          else
            git commit -m 'Build direct dashboard data [skip ci]'
            git push
          fi
